name: Import real AM tasks and PDFs from Aufgabenpool (one shot)
on:
  push:
    branches: [fix/mathsverse-official-aufgabenpool-20261124]
    paths: [.github/workflows/maths-import-official-once.yml]
permissions: {contents: write}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install official search parser
        run: pip install -q 'curl_cffi>=0.9' 'beautifulsoup4>=4.12'
      - name: Retrieve exact descriptor data and verify official PDF bytes
        run: python scripts/maths/import_official_aufgabenpool.py
      - name: Show imported PDF inventory
        run: |
          du -sh public/maths/sa-01/official-pdfs
          python - <<'PY'
          import json
          d=json.load(open('public/maths/sa-01/official-pdfs/import-report.json'))
          print('SUMMARY: total',d['total'],'original tasks')
          for code,info in d['descriptor_counts'].items():
            print(code,info)
          PY
      - name: Commit ONLY official PDF assets and generated official task bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/maths/sa-01/official-pdfs/ public/maths/sa-01/sa1-scope-bank.js
          git diff --cached --stat | tail -n 12
          git commit -m 'assets(maths): import source-verified Aufgabenpool PDFs by exact SA descriptor'
          git push origin HEAD:fix/mathsverse-official-aufgabenpool-20261124
      - name: Exercise Mathsverse content invariants
        run: node scripts/test-mathsverse.cjs
