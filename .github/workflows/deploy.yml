name: Deploy Studyverse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Chemverse quiz and daily Token economy
        run: node scripts/test-chemverse.cjs

      - name: Test DSAIVERSE lessons, mini-games and Boss
        run: node scripts/test-dsaiverse.cjs

      - name: Test Sharpverse first PA, writing lab and threading simulations
        run: node scripts/test-sharpverse.cjs
      - name: Verify every Verse sidebar ends with Boss and Quellen
        run: node scripts/test-verse-endgame.cjs

      - name: Test Mathsverse homework revision, exact integrals and boss
        run: node scripts/test-mathsverse.cjs

      - name: Verify STUDYVERSE backup transfer (old and new saves)
        run: node scripts/test-save-transfer.cjs

      - name: Test live cosmetics preview and locked learning worlds
        run: node scripts/test-shop-preview.cjs

      - name: Verify cross-verse daily arena and shared TT caps
        run: node scripts/test-daily.cjs

      - name: Test account cloud mirror and session refresh
        run: node scripts/test-cloud-sync.cjs

      - name: Test public friends directory and responsive shop/profile UI
        run: node scripts/test-public-profiles.cjs

      - name: Test account-specific fair-play warning and no automated bans
        run: node scripts/test-account-warning.cjs

      - name: Test Firebase web config injection
        run: node scripts/test-build-cloud-config.cjs

      - name: Build Angular for GitHub Pages
        run: npm run build -- --base-href /studyverse/ --output-path dist/site

      - name: Inject Firebase config into generated Pages artifact
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.APIKEYFIREBASEDB || vars.APIKEYFIREBASEDB }}
        run: node scripts/inject-cloud-config.cjs dist/site/browser/cloud-config.json

      - name: SPA fallback for deep links
        run: cp dist/site/browser/index.html dist/site/browser/404.html

      - name: Install Chromium test driver
        run: npm install --no-save --package-lock=false playwright

      - name: Test real mobile browser layouts (320–768 px)
        run: node scripts/test-mobile-layout.cjs

      - name: Save mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-previews
          path: mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site/browser

      # Upload is complete before the artifact is necessarily visible to the Actions API.
      # Waiting for actual list visibility avoids deploy-pages claiming no artifact exists.
      - name: Wait until the Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$found" = "1" ]; then
              echo "GitHub Pages artifact is visible (attempt ${attempt})."
              exit 0
            fi
            echo "Waiting for Pages artifact API indexing (attempt ${attempt})..."
            sleep 3
          done
          echo "::error::Pages artifact did not become visible in GitHub Actions API"
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
