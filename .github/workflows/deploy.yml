name: Deploy Studyverse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Chemverse quiz and daily Token economy
        run: node scripts/test-chemverse.cjs

      - name: Test DSAIVERSE lessons, mini-games and Boss
        run: node scripts/test-dsaiverse.cjs

      - name: Verify STUDYVERSE backup transfer (old and new saves)
        run: node scripts/test-save-transfer.cjs

      - name: Test live cosmetics preview and locked learning worlds
        run: node scripts/test-shop-preview.cjs

      - name: Verify cross-verse daily arena and shared TT caps
        run: node scripts/test-daily.cjs

      - name: Test account cloud mirror and session refresh
        run: node scripts/test-cloud-sync.cjs

      - name: Build Angular for GitHub Pages
        run: npm run build -- --base-href /studyverse/ --output-path dist/site

      - name: SPA fallback for deep links
        run: cp dist/site/browser/index.html dist/site/browser/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site/browser

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
