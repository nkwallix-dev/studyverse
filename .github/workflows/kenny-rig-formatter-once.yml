name: One-time format Kenny PNG rig TS
on:
  push:
    branches:
      - feature/kenny-image-parts-rig-20261123
    paths:
      - '.github/workflows/kenny-rig-formatter-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format exactly the Kenny rig component
        run: |
          npx prettier --write src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.ts
          npm run format:check
      - name: Commit only formatted component back to Kenny branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(kenny): apply Prettier to part-rig TS"
            git push origin HEAD:feature/kenny-image-parts-rig-20261123
          fi
