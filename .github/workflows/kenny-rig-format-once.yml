name: One-time Kenny rig format
on:
  push:
    branches:
      - feature/kenny-master-rig-preview-20261123
    paths:
      - .github/workflows/kenny-rig-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the isolated Kenny Designer files
        run: npx prettier --write "src/app/features/dinoverse/dino-designer/**/*.{ts,html,scss}"
      - name: Commit formatted result to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/app/features/dinoverse/dino-designer/
          if ! git diff --cached --quiet; then
            git commit -m "style(kenny): apply repository Prettier conventions"
            git push origin HEAD:feature/kenny-master-rig-preview-20261123
          fi
