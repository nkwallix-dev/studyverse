name: Sync Studyverse public display levels

on:
  schedule:
    # GitHub may drop scheduled jobs during peak load at the top of the hour.
    # Offset the five-minute sync and refresh its scheduled-workflow actor.
    - cron: '3-59/5 * * * *'
    # A second offset gives a skipped scheduled run another chance shortly after.
    - cron: '1-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-levels.yml'
      - 'scripts/sync-public-levels.cjs'
  workflow_dispatch:

concurrency:
  group: studyverse-public-rank-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate to production Firebase using short-lived GitHub OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/916949777071/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: studyverse-public-ranks@studyverse-logins.iam.gserviceaccount.com
          project_id: studyverse-logins
          token_format: access_token
          access_token_lifetime: 600s
      - name: Backfill missing profiles and refresh public display levels
        env:
          GCLOUD_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/sync-public-levels.cjs
