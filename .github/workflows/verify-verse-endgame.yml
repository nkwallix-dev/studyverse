name: Verify shared Verse Endgame sidebar

on:
  pull_request:
    paths:
      - 'public/nawi/test-01/index.html'
      - 'public/dsai/test-01/index.html'
      - 'public/dsai/test-01/app.js'
      - 'public/dsai/test-01/style.css'
      - 'public/pos/pa-01/index.html'
      - 'public/pos/pa-01/app.js'
      - 'public/shared/verse-endgame.css'
      - 'scripts/test-verse-endgame.cjs'
      - '.github/workflows/verify-verse-endgame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check identical final sidebar order and functioning links
        run: |
          node scripts/test-verse-endgame.cjs
          node scripts/test-chemverse.cjs
          node scripts/test-dsaiverse.cjs
          node scripts/test-sharpverse.cjs
      - name: Build Studyverse
        run: npm run build -- --base-href /studyverse/
