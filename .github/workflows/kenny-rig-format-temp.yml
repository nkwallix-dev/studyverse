name: One-time Kenny PNG rig formatting
on:
  push:
    branches:
      - feature/kenny-image-parts-rig-20261123
    paths:
      - '.github/workflows/kenny-rig-format-temp.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write 'src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.ts' 'src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.html'
          npx prettier --write 'src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.ts' 'src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.html'
          npm run format:check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.ts src/app/features/dinoverse/dino-designer/kenny-rig-preview.component.html
          if ! git diff --cached --quiet; then
            git commit -m 'style(kenny): normalize image rig preview'
            git push origin HEAD:feature/kenny-image-parts-rig-20261123
          fi
