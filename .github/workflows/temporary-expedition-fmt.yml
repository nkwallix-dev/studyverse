name: Temporary Prettier helper (Expedition final)
on:
  push:
    branches:
      - feat/stachelweide-random-hardcore-20261120
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/app/features/dinoverse/platformer/*.{ts,html,scss}'
      - name: Commit formatted expedition
        run: |
          git config user.name "studyverse-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/features/dinoverse/platformer
          if ! git diff --cached --quiet; then
            git commit -m "style: format exploration and game-over UI"
            git push origin HEAD:feat/stachelweide-random-hardcore-20261120
          fi
