name: Temporary Prettier helper (Kennyverse)
on:
  push:
    branches:
      - feat/kennyverse-tutorial-hud-20261120
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/features/dinoverse/platformer/kenny-platformer.component.html
      - name: Commit formatted template
        run: |
          git config user.name "studyverse-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/features/dinoverse/platformer/kenny-platformer.component.html
          if ! git diff --cached --quiet; then
            git commit -m "style: format Kennyverse tutorial template"
            git push origin HEAD:feat/kennyverse-tutorial-hud-20261120
          fi
