name: Validate Firebase security and controlled deployment

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase/**'
      - 'firebase.json'
      - 'functions/**'
      - 'scripts/test-security-emulators.cjs'
      - 'scripts/migrate-wallets.cjs'
      - 'scripts/seed-server-catalog.cjs'
      - '.github/workflows/firebase-rules.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase/**'
      - 'firebase.json'
      - 'functions/**'
      - 'scripts/test-security-emulators.cjs'
      - 'scripts/migrate-wallets.cjs'
      - 'scripts/seed-server-catalog.cjs'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install front-end dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Build TypeScript functions
        run: npm --prefix functions run build
      - name: Run security policy unit tests
        run: node --test functions/test/core.test.cjs
      - name: Ensure both copies of Firestore rules are identical
        run: cmp firestore.rules firebase/firestore.rules
      - name: Validate Angular compatibility
        run: npm run build -- --base-href /studyverse/
      - name: Run actual Firestore, Auth and Functions emulator integration tests
        run: |
          npm install --global firebase-tools
          firebase emulators:exec --project demo-studyverse-rules --only firestore,auth,functions "node scripts/test-security-emulators.cjs"

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.FIREBASE_WIF_PROVIDER != '' &&
      vars.FIREBASE_DEPLOY_SA != '' &&
      vars.STUDYVERSE_SECURITY_CUTOVER_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: firebase-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Build functions
        run: npm --prefix functions run build
      - name: Authenticate with Google Cloud OIDC (no long-lived keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SA }}
          project_id: studyverse-logins
      - name: Publish server rules and callable functions
        run: |
          npm install --global firebase-tools
          firebase deploy --only firestore:rules,functions --project studyverse-logins --non-interactive
