name: Normalize Kenny Zebra Fusions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kenny-zebra-palette.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Normalize 64 real zebra fusion frames
        run: python3 scripts/normalize-kenny-fusion-colors.py
      - name: Verify unchanged sprite grid and non-empty raster
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('public/kenny/animations/fusions/zebra.png').convert('RGBA')
          assert im.size==(1254,1254)
          assert sum(im.getchannel('A').getextrema())>0
          PY
      - name: Publish corrected zebra atlas
        run: |
          git config user.name "studyverse-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kenny/animations/fusions/zebra.png
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "assets(kenny): white zebra fusion palette and golden irises [skip ci]"
            git push origin HEAD:main
          fi
