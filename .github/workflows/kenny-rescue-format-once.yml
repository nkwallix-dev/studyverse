name: Temporary rescue branch formatting repair
on:
  push:
    branches:
      - codex/kenny-30fps-rescue-20261123
    paths:
      - .github/workflows/kenny-rescue-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository-defined Prettier formatting
        run: npx prettier --write "src/app/features/**/*.{ts,html,scss}"
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/app/features
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize feature formatting for Kenny rescue CI"
            git push origin HEAD:${{ github.ref_name }}
          fi
