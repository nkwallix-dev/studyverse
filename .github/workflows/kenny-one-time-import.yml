name: Produce Kenny rig PNG parts (one shot)
on:
  push:
    branches:
      - feature/kenny-image-parts-rig-20261123
    paths:
      - .github/workflows/kenny-one-time-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export individual transparent Kenny body parts for five skins
        run: node scripts/kenny/build-parts-from-master.mjs
      - name: Verify pixel-exact blue reconstruction and all five skins
        run: node scripts/kenny/test-rig-parts.mjs
      - name: Commit generated PNG parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kenny/rig/v1/
          if ! git diff --cached --quiet; then
            git commit -m "assets(kenny): export rig body PNGs and skin palettes"
            git push origin HEAD:feature/kenny-image-parts-rig-20261123
          fi
