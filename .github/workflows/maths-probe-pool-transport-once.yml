name: Probe official Aufgabenpool fetch strategies (one shot)
on:
  push:
    branches: [fix/mathsverse-official-aufgabenpool-20261124]
    paths: [.github/workflows/maths-probe-pool-transport-once.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q 'curl_cffi>=0.9' beautifulsoup4
      - run: |
          python - <<'PY'
          from curl_cffi import requests
          import re,time
          for domain in ['https://aufgabenpool.at/amn/','https://www.aufgabenpool.at/amn/']:
            for style in ['chrome','safari']:
              s=requests.Session(impersonate=style)
              try:
                a=s.get(domain+'index.php?id=AM',timeout=20)
                b=s.get(domain+'js/index.js',timeout=20,headers={'Referer':domain+'index.php?id=AM'})
                print('PROBE',domain,style,'INDEX',a.status_code,len(a.content),'JS',b.status_code,len(b.content),flush=True)
                if b.status_code==200:
                  lines=b.text.splitlines()
                  for i,l in enumerate(lines):
                    if re.search('desk|loadMore|\\.php|ajax|fetch\\(',l,re.I):
                      print('JS',i+1,' '.join(lines[max(0,i-2):i+6])[:1200])
                  break
                else:print('ERRFRAG',b.text[:120])
              except Exception as e:print('ERROR',str(e)[:300])
          PY
