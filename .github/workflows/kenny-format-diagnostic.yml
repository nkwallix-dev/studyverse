name: Temporary Kenny formatting diagnostics
on:
  push:
    branches: [feat/kenny-skilltree-dropthrough-bite-20261121]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Show exact Prettier patch
        run: |
          npx prettier --write "src/app/features/**/*.{ts,html,scss}"
          git diff -- src/app/features/dinoverse
