name: Correct original MathsVerse artwork
on:
  push:
    branches: [feat/mathsverse-book-groups-official-pool-20261123]
    paths: [.github/workflows/import-mathsverse-artwork.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the user-provided original scans
        env:
          BOOK_ARCHIVE_URL: https://at.adobe.com/NmV1qanOGm8Jquno
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 "$BOOK_ARCHIVE_URL" -o /tmp/original-book.zip
          unzip -t /tmp/original-book.zip | tail -2
      - name: Crop only at verified exercise boundaries
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/import-maths-book-artwork.py /tmp/original-book.zip public/maths/sa-01/original-figures
      - name: Push original scans and crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maths/sa-01/original-figures
          git diff --cached --quiet && exit 0
          git commit -m "assets(mathsverse): correct original book 1.79-1.81 image crops"
          git push origin HEAD:feat/mathsverse-book-groups-official-pool-20261123
