name: Import original MathsVerse screenshots
on:
  push:
    branches:
      - feat/mathsverse-book-groups-official-pool-20261123
    paths:
      - .github/workflows/import-mathsverse-artwork.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch uploaded user reference archive
        env:
          BOOK_ARCHIVE_URL: https://at.adobe.com/NmV1qanOGm8Jquno
        run: |
          set -euo pipefail
          curl --fail --location --max-time 100 --retry 2 "$BOOK_ARCHIVE_URL" --output /tmp/maths-book-original.zip
          file /tmp/maths-book-original.zip
          unzip -t /tmp/maths-book-original.zip | tail -3
      - name: Extract original page images
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/import-maths-book-artwork.py /tmp/maths-book-original.zip public/maths/sa-01/original-figures/
      - name: Commit images to task branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/maths/sa-01/original-figures/
          git diff --cached --quiet && exit 0
          git commit -m "assets(mathsverse): import user-provided original textbook diagrams"
          git push origin HEAD:feat/mathsverse-book-groups-official-pool-20261123
