name: Inspect official AM descriptor search (one shot)
on:
  push:
    branches: [fix/mathsverse-official-aufgabenpool-20261124]
    paths: [.github/workflows/maths-inspect-pool-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests beautifulsoup4
      - name: Probe official site form and HTML structure
        run: |
          python - <<'PY'
          import requests,bs4,re
          for url in ['https://aufgabenpool.at/amn/index.php?id=AM','https://prod.aufgabenpool.at/amn/index.php?id=AM','https://www.aufgabenpool.at/amn/index.php?id=AM']:
            try:
              r=requests.get(url,timeout=15,headers={'User-Agent':'Mozilla/5.0 (compatible; Studyverse-school/1.0)'})
              print('URL',url,'STATUS',r.status_code,'FINAL',r.url,'LENGTH',len(r.content),'FIRST',r.text[:220])
              if r.status_code!=200:continue
              s=bs4.BeautifulSoup(r.text,'html.parser')
              print('TITLE',s.title,'FORMS',[(x.get('action'),x.get('method'),[(i.get('name'),i.get('id'),i.get('value')) for i in x.find_all(['input','select'])][:25]) for x in s.find_all('form')])
              print('SCRIPTS',[(x.get('src') or x.text[:100]) for x in s.find_all('script')][-20:])
              print('descriptor candidates',[(x.name,x.get('id'),x.get('name'),x.get('placeholder')) for x in s.find_all(['input','select']) if re.search('deskrip|komp|suche|search',str(x),re.I)][:20])
              print('PDF LINKS',len(s.select('a[href$=".pdf"]')),'CHECKBOXES',len(s.select('[data-value]')))
              print('BUTTON',[(x.get('id'),x.get('onclick'),x.get_text(strip=True)[:40]) for x in s.find_all('button')][:25])
            except Exception as e:print('ERROR',str(e)[:300])
          PY
