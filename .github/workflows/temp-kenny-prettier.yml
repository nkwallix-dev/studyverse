name: Temporary Kennyverse Prettier update
on:
  push:
    branches:
      - feat/kenny-real-fusion-atlases-20261121
permissions:
  contents: write
concurrency:
  group: kenny-atlas-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply official project formatting
        run: |
          npx prettier --write "src/app/features/**/*.{ts,html,scss}"
          git add src/app/features/dinoverse/platformer
          if git diff --cached --quiet; then
            echo "No further formatting changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(kenny): apply project Prettier formatting"
            git push origin HEAD:refs/heads/feat/kenny-real-fusion-atlases-20261121
          fi
