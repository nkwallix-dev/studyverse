name: Import Kenny Rig v2 Batch 02 (one-shot)
on:
  push:
    branches: [feature/kenny-rig-v2-batch02-limbs-20261123]
    paths: [.github/workflows/kenny-batch02-import-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download ten validated PNG layers
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://at.adobe.com/Hrr1hSsyRDbiN76D' -o /tmp/kenny-batch02.zip
          unzip -t /tmp/kenny-batch02.zip
          unzip -oq /tmp/kenny-batch02.zip -d .
          test -f kenny-rig-v2/batch-02/manifest.json
      - name: Verify source geometry, original identity, three fingers, and joint continuity
        run: |
          python -m pip install --quiet numpy Pillow scipy opencv-python-headless
          python kenny-rig-v2/batch-02/verify_batch02.py
      - name: Commit review-only assets to isolated Kenny branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- kenny-rig-v2/batch-02/
          git diff --cached --stat
          git commit -m "assets(kenny): add 10 body and limb PNGs with rig metadata for v2 batch 02"
          git push origin HEAD:feature/kenny-rig-v2-batch02-limbs-20261123
