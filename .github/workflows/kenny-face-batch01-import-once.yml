name: Import Kenny v2 Face Batch 01 (one shot)
on:
  push:
    branches: [feature/kenny-rig-v2-batch01-face-20261123]
    paths: [.github/workflows/kenny-face-batch01-import-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download reviewed ten-file PNG batch
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://at.adobe.com/x39QQUniU55CCrEH' --output /tmp/kenny-face-batch01.zip
          unzip -t /tmp/kenny-face-batch01.zip
          unzip -oq /tmp/kenny-face-batch01.zip -d .
          test -f kenny-rig-v2/batch-01/manifest.json
      - name: Validate actual isolated PNGs against original approved master
        run: |
          python -m pip install --quiet numpy Pillow scipy opencv-python-headless
          python kenny-rig-v2/batch-01/verify_batch01.py
      - name: Push only face assets to isolated feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- kenny-rig-v2/batch-01/
          git diff --cached --stat
          git commit -m 'assets(kenny): add 10 independently validated face layers for v2 batch 01'
          git push origin HEAD:feature/kenny-rig-v2-batch01-face-20261123
