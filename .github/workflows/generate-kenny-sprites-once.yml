name: Generate Kenny skin sprite PNGs
on:
  push:
    branches:
      - feat/kenny-five-native-sprites-20261116
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sprite branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sprite generator dependencies
        run: python -m pip install --quiet pillow numpy
      - name: Build all five native skin sprite sheets
        run: python scripts/generate-kenny-skins.py
      - name: Verify output asset inventory
        run: |
          test "$(find src/assets/kenny/skins -name 'kenny-*-strip.png' | wc -l)" -eq 10
          test "$(find public/kenny/skins -name 'kenny-*-portrait.png' | wc -l)" -eq 5
      - name: Commit generated PNGs to the feature branch
        run: |
          git config user.name "studyverse-sprite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/kenny/skins public/kenny/skins
          if ! git diff --cached --quiet; then
            git commit -m "Add blue pink green red and zebra idle/feed PNG sprite assets"
            git push origin HEAD:feat/kenny-five-native-sprites-20261116
          fi
