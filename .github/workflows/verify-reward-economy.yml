name: Verify learning rewards and item shop

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'public/maths/**'
      - 'scripts/test-stachelweide.cjs'
      - 'scripts/test-companion-equipment.cjs'
      - 'scripts/test-kenny-platformer.cjs'
      - 'scripts/test-kenny-platformer-browser.cjs'
      - 'scripts/test-dino-season.cjs'
      - 'scripts/test-daily.cjs'
      - 'scripts/test-mobile-layout.cjs'
      - 'public/daily/**'
      - 'public/kennyverse/**'
      - 'public/shared/kenny-access.js'
      - 'scripts/test-reward-economy.cjs'
      - 'scripts/test-shop-preview.cjs'
      - 'scripts/test-mathsverse.cjs'
      - '.github/workflows/verify-reward-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify milestone-based shop and MathsVerse retirement
        run: |
          node scripts/test-dino-season.cjs
          node scripts/test-daily.cjs
          node scripts/test-reward-economy.cjs
          node scripts/test-reward-carousel-and-ranks.cjs
          node scripts/test-shop-preview.cjs
          node scripts/test-mathsverse.cjs
      - name: Check account, transfer and friends regression tests
        run: |
          node scripts/test-save-transfer.cjs
          node scripts/test-public-profiles.cjs
          node scripts/test-account-warning.cjs
          node scripts/test-chemverse.cjs
          node scripts/test-dsaiverse.cjs
          node scripts/test-sharpverse.cjs
      - name: Test Kenny platformer course and checkpoint mechanics
        run: |
          node scripts/test-companion-equipment.cjs
          node scripts/test-stachelweide.cjs
          node scripts/test-kenny-platformer.cjs

      - name: Angular production build for GitHub Pages
        run: npm run build -- --base-href /studyverse/ --output-path dist/site
      - name: Install real browser driver
        run: npm install --no-save --package-lock=false playwright
      - name: Test mobile layouts and companion gameplay before merge
        run: |
          node scripts/test-mobile-layout.cjs
          node scripts/test-kenny-platformer-browser.cjs
      - name: Save desktop and mobile gameplay previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-previews
          path: mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 7
