name: Verify learning rewards and item shop

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'public/maths/**'
      - 'scripts/test-reward-economy.cjs'
      - 'scripts/test-shop-preview.cjs'
      - 'scripts/test-mathsverse.cjs'
      - '.github/workflows/verify-reward-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify milestone-based shop and MathsVerse retirement
        run: |
          node scripts/test-reward-economy.cjs
          node scripts/test-reward-carousel-and-ranks.cjs
          node scripts/test-shop-preview.cjs
          node scripts/test-mathsverse.cjs
      - name: Check account, transfer and friends regression tests
        run: |
          node scripts/test-save-transfer.cjs
          node scripts/test-public-profiles.cjs
          node scripts/test-account-warning.cjs
          node scripts/test-chemverse.cjs
          node scripts/test-dsaiverse.cjs
          node scripts/test-sharpverse.cjs
      - name: Angular production build
        run: npm run build -- --base-href /studyverse/
