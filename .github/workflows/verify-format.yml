name: Check Angular feature formatting

on:
  pull_request:
    paths:
      - 'src/app/features/**'
      - '.editorconfig'
      - '.prettierrc'
      - 'package*.json'
      - '.github/workflows/verify-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
